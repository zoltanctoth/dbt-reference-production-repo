name: Prod deploy (on merge to main / manual)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Production deps and build
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_USER: ${{ secrets.DBT_USER }}
      PRIVATE_KEY_PASSPHRASE: ${{ secrets.PRIVATEKEY_PASS }}

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - run: uv python install 3.13
      - run: uv sync
      - name: Prepare Snowflake private key
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_KEY_BASE64"
          test -n "$PRIVATE_KEY_PASSPHRASE"
          key_path="$RUNNER_TEMP/snowflake_key.p8"
          printf '%s' "$PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - run: cd airbnb && uv run dbt deps --profiles-dir _prod_profiles --target prod
      - run: cd airbnb && uv run dbt build --profiles-dir _prod_profiles --target prod

      - name: Upload prod target as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-target
          path: airbnb/target/
          retention-days: 90
